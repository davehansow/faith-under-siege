<!-- FAITH LEADERS LETTER · paste into a Code Block placed directly BELOW your Form block, in the SAME section. -->
<div class="fus fus-fl-share">
  <p class="fus-eyebrow">Signed? Ask others to join you</p>
  <p class="fus-fl-share__text">Every name adds weight. Share the letter with your congregation, staff and fellow pastors.</p>
  <div class="fus-fl-share__row">
    <button type="button" class="fus-btn" data-fl-copy>Copy link</button>
    <a class="fus-btn" data-fl-share="email" href="#">Email</a>
    <a class="fus-btn" data-fl-share="x" href="#" target="_blank" rel="noopener">X</a>
    <a class="fus-btn" data-fl-share="fb" href="#" target="_blank" rel="noopener">Facebook</a>
    <a class="fus-btn" data-fl-share="sms" href="#">Text</a>
  </div>
</div>
<script>
(function () {
  var url = location.origin + location.pathname, msg = "I signed the faith leaders' letter standing with Ukraine's persecuted church. Will you add your name?";
  var links = { email: 'mailto:?subject=' + encodeURIComponent("Sign the faith leaders' letter on Ukraine") + '&body=' + encodeURIComponent(msg + '\n\n' + url),
    x: 'https://x.com/intent/post?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(url),
    fb: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), sms: 'sms:?&body=' + encodeURIComponent(msg + ' ' + url) };
  document.querySelectorAll('[data-fl-share]').forEach(function (a) { a.href = links[a.getAttribute('data-fl-share')]; });
  var b = document.querySelector('[data-fl-copy]');
  if (b) b.addEventListener('click', function () {
    var done = function () { b.textContent = 'Link copied'; setTimeout(function () { b.textContent = 'Copy link'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  });
})();
</script>

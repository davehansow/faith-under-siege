<section class="fus fus-section fus-team-list"><div class="fus-wrap">
  <div class="fus-quotes">
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“During my recent time in Ukraine performing with the Ukrainian Orchestra, I was awestruck by the fortitude of the Ukrainian people. In the face of war and tragedy, they continue to defend their freedom, their way of life, and love of country. They are a David undeterred by the Goliath. Music, art, and cinematography have shown a unique power to capture the spirit of the Ukrainian people in their most difficult days. ‘Faith Under Siege’ does exactly that by shining a spotlight on Russia’s vicious persecution of Ukrainian Christians while also capturing how their faith, and hope for a better tomorrow, keeps them going.”</p></blockquote>
      <figcaption><strong>John Ondrasik</strong><span>Five for Fighting</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“Through powerful firsthand accounts, A Faith Under Siege reveals the chilling reality of Christian persecution in Ukraine at the hands of Russian forces. This film is an urgent plea to the international community and a vital reminder of what is at stake when freedom of faith is under attack. I urge you to watch this film and pray for Ukraine.”</p></blockquote>
      <figcaption><strong>Chad Connelly</strong><span>Founder and President, Faith Wins</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“Laurie and I have been a part of 13 theatrically released productions, documentaries, and feature films, and we understand how difficult they are even for someone who has grown up in a communications family like mine. So to think of our dear friend, Colby Barrett, a farmer and engineer, dropping everything simply to obey the voice of the Lord telling him to create this film… we say, ‘bravo and well done!’ We couldn’t be more proud of Colby for hearing God’s voice, jumping all in especially outside of his comfort zone, and producing this moving film. A Faith Under Siege speaks with honesty, urgency, and heart. This film is a testament to the resilience of the human spirit and the strength of faith amidst persecution. A powerful and timely documentary that every person of faith should watch.”</p></blockquote>
      <figcaption><strong>Matt and Laurie Crouch</strong><span>Matt Crouch, President of the Trinity Broadcasting Network</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“The world needs to see how Ukrainian Christians have been brutally massacred, executed, and destroyed by Russians since their full-scale invasion of Ukraine. I need every supporter of Ukraine and Christians of the World to watch this free documentary called #FaithUnderSeige. Dr. Martin Luther King Jr. said, ‘There comes a time when silence is betrayal. Our lives begin to end the day we become silent about things that matter. In the end, we will remember not the words of our enemies but the silence of our friends.’ Share this with everyone. Make this go viral. If you are silent about this, then you’re supporting the evil Russians are doing to innocent people of Faith in Ukraine.”</p></blockquote>
      <figcaption><strong>Pastor Mark Burns</strong><span>Founder, The NOW Television Network; “President Trump’s Top Pastor”</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“Faith Under Siege shows the ever-increasing cost we face for failing to stand up in the face of evil. As America’s enemies integrate, we cannot isolate. From Israel to Ukraine, Iranian weapons, be they in the hands of the Russian barbarians or Iranian proxy terrorists, maim and murder Christians and Jews every day across multiple continents. Faith Under Siege is a wakeup call to the Judeo-Christian world: we are under attack.”</p></blockquote>
      <figcaption><strong>Pastor John Hagee</strong><span>Founder and Chairman, CUFI</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“A Faith Under Siege is shocking in its detail of targeted Russian persecution of the large evangelical community in Ukraine and the abduction of nearly 20,000 children. Every American Christian should see this film - immediately!”</p></blockquote>
      <figcaption><strong>Pat Boone</strong><span>Singer, actor, author and television personality</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“One of today’s great untold stories of believers suffering for their faith yet overcoming through their faith comes from Ukraine. More than 2.5 million Ukrainian Christians live under Russian occupation. Vladimir Putin has shut down every church in occupied Ukraine not controlled by the Kremlin and made it a crime for believers to hold a Bible study in their home. A Faith Under Siege gives us a look into the lives of courageous Christians who have suffered so much yet kept their eyes on the Lord.”</p></blockquote>
      <figcaption><strong>Ken Blackwell</strong><span>U.S. Ambassador (ret.), United Nations Human Rights Commission</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“A Faith Under Siege is an inspiring look at what’s happening in Ukraine - the forces of evil trying to destroy it and God’s forces of good holding on, holding the line, and even growing in faith and spreading God’s love in Jesus’ name. I love seeing the faces and hearing the voices of Ukrainian people and their resilience, which comes from God, that no matter what happens, they’re part of building God’s kingdom on earth as it is in heaven. Having been to Ukraine and seen the damage - and how fast the people clean up - showed me firsthand their spirit and their faith. Please watch A Faith Under Siege and pray, as God leads you, that the people of Ukraine be completely free and that these attacks would stop. We stand with the people of Ukraine wherever we are - Burma, the Middle East, Tajikistan, and Afghanistan. Thank you all for being with them as well. And we pray for full freedom and for peace and reconciliation in Jesus’ name. A Faith Under Siege helps us go in that direction.”</p></blockquote>
      <figcaption><strong>Dave Eubank</strong><span>Former U.S. Army Special Forces and Ranger officer; founder and leader of the Free Burma Rangers (FBR)</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“A deeply moving film that conveys the brutality of Russian forces not just to Ukrainian soldiers, but also to Ukrainian civilians, several million of which live in Ukrainian land occupied by Russia. Regardless of one’s faith, it is impossible not to feel enormous respect for the missionaries through whose compassionate eyes this powerful documentary presents the reality of the war in Ukraine – and through whose faith their efforts have been sustained.”</p></blockquote>
      <figcaption><strong>General David Petraeus</strong><span>U.S. Army (Ret.); former Commander of the Surge in Iraq, U.S. Central Command, and NATO/U.S. Forces in Afghanistan; former Director of the CIA; co-author of <em>Conflict: The Evolution of Warfare from 1945 to Gaza</em></span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“A Faith Under Siege isn’t only about exposing Russian war crimes, it’s a call-to-action for Christians worldwide to pray and stand with their brothers and sisters in Ukraine.”</p></blockquote>
      <figcaption><strong>Chuck Holton</strong><span>CBN News</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“A Faith Under Siege shines a light on the brutal persecution of Christians in Ukraine and the Russian-occupied territories, offering a powerful testament to faith and courage. This film is more than a documentary- it tests our principles. Regardless of policy debates, we all are responsible for defending religious freedom and human dignity.”</p></blockquote>
      <figcaption><strong>Lisa Gable</strong><span>Former U.S. Ambassador</span></figcaption>
    </figure>
    <figure class="fus-quote">
      <div class="fus-quote__stars" aria-hidden="true">★★★★★</div>
      <blockquote><p>“If you want to know what’s really happening to Evangelical pastors in Ukraine, you don’t have to take my word for it—you can watch it yourself in this powerful documentary.”</p></blockquote>
      <figcaption><strong>Gordon Robertson</strong><span>President, CBN</span></figcaption>
    </figure>
  </div>

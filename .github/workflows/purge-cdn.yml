name: Purge jsDelivr cache
on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'data/**']
  workflow_dispatch: {}
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge changed files so the site gets them right away
        run: |
          for f in js/fus.js css/fus.css data/films.json data/press.json data/laurels.json data/youtube.json; do
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done
